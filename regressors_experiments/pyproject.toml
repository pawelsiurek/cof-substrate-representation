[project]
name = "regressors-experiments"
version = "0.1.0"
description = "Capacity regressors on COF substrates (no chain split)."
requires-python = ">=3.12"
dependencies = [
    "rdkit>=2024.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "optuna>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[dependency-groups]
# Pretrained models (notebook 05). Same versions as precursor2cof-capacitance.
# Installed by default; skip with `uv sync --no-group gpu`.
gpu = [
    "torch==2.8.0",
    "chemprop==2.2.1",
    "tabpfn==2.2.1",
]

[tool.uv]
default-groups = ["gpu"]
